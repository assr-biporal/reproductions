AMPA:
  model: "
    g_AMPA_post = scl*(g_r + g_d)/norm : siemens (summed)\n
    dg_r/dt = -g_r/tau_r + noise : siemens (clock-driven)\n
    dg_d/dt = -g_d/tau_d + noise : siemens (clock-driven)\n
    "
  on_pre: "
    g_r += w\n
    g_d += w\n
    "
  namespace:
    norm: '0.472689'
    tau_r: '0.5*ms'
    tau_d: '20*ms'
    noise: '0*uS/ms' #noise=0 is temporary
