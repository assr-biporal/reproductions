AMPA:
  model: "
    I_syn_post = I_AMPA + I_NMDA + I_GABA : siemens (summed)\n
    I_AMPA = g_AMPA*(V_pre-V_E) : ampere\n
    g_AMPA = scl*(g_AMPA_r + g_AMPA_d)/norm_AMPA : siemens (clock-driven)\n
    dg_AMPA_r/dt = -g_AMPA_r/tau_AMPA_r : siemens (clock-driven)\n
    dg_AMPA_d/dt = -g_AMPA_d/tau_AMPA_d : siemens (clock-driven)\n
    "
  on_pre: "
    g_r += w\n
    g_d += w\n
    "
  namespace:
    norm: '0.472689'
    tau_r: '0.5*ms'
    tau_d: '20*ms'
    noise: '0*uS/ms' #noise=0 is temporary
NMDA:
  model: "
    g_NMDA_post = scl*(g_r + g_d)/norm : siemens (summed)\n
    dg_r/dt = -g_r/tau_r : siemens (clock-driven)\n
    dg_d/dt = -g_d/tau_d : siemens (clock-driven)\n
    "
  on_pre: "
    g_r += w\n
    g_d += w\n
    "
  namespace:
    norm: '0.904821'
    tau_r: '2*ms'
    tau_d: '100*ms'
    noise: '0*uS/ms' #noise=0 is temporary
GABA:
  model: "
    g_GABA_post = scl*(g_r + g_d)/norm : siemens (summed)\n
    dg_r/dt = -g_r/tau_r : siemens (clock-driven)\n
    dg_d/dt = -g_d/tau_d : siemens (clock-driven)\n
    "
  on_pre: "
    g_r += w\n
    g_d += w\n
    "
  namespace:
    norm: '0.697016'
    tau_r: '0.5*ms'
    tau_d: '5*ms'
    noise: '0*uS/ms' #noise=0 is temporary
